name: "💎 style"

on: pull_request

jobs:
    style:
        name: "💎 style"
        runs-on: ubuntu-latest
        steps:
            - name: "📚 checkout"
              uses: actions/checkout@v7.0.1
            - name: "🟢 node"
              uses: actions/setup-node@v7.0.0
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org/
            - name: "📦 install"
              run: npm ci
              env:
                  DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
            - name: "🧶 lint"
              run: npm run lint
            - name: "💾 format"
              run: npm run format
